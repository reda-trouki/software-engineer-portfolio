[build]
  command = "pnpm run build"

[build.environment]
  NODE_VERSION = "24"

# Netlify detects Next.js automatically. Set these in Site settings > Environment variables:
#   ADMIN_PIN, SESSION_SECRET            (required)
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, CONTACT_TO   (optional: email notifications)
# Data and uploaded images are stored in Netlify Blobs automatically.
